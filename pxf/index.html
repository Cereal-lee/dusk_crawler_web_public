<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142332"><title>Dusk · Effect Lab</title><link rel="stylesheet" href="/shared/workshop.css"></head>
<body class="effect-lab">
<main>
 <header class="lab-heading"><div><p class="eyebrow">DUSK / EFFECT LAB</p><h1>픽셀에서 시작하는 전투의 순간</h1><p>도형을 연결하고, 움직임을 더하고, 게임으로 내보내세요.</p></div><button class="primary" data-action="new">새 그래프 만들기</button></header>
 <section class="lab-actions" aria-label="제작 도구"><button data-action="prompt">AI로 초안 만들기</button><button data-action="import">JSON 열기</button><button data-action="file">파일 선택</button><button data-action="backup">내 작업 백업</button><button data-action="connection">AI 연결 확인</button></section>
 <section class="cloud-bar" aria-label="저장 상태"><span id="account-label">저장소 연결 중</span><span id="sync-state" role="status" aria-live="polite">동기화 중</span><button data-action="sync">새로 동기화</button><a id="sync-login" href="/signin-with-chatgpt?return_to=%2Fpxf%2F" hidden>로그인</a></section>
 <section class="collection-heading"><div><p class="eyebrow">YOUR COLLECTION</p><h2>이펙트 라이브러리</h2><small id="library-count" role="status"></small></div><div class="collection-tools"><label class="sr-only" for="search">작품 검색</label><input id="search" placeholder="작품 이름 검색"><label class="sr-only" for="catalog-filter">작품 분류</label><select id="catalog-filter"><option value="all">모든 작품</option><option value="presets">시작 템플릿</option><option value="mine">저장한 작업</option></select><nav aria-label="보기 방식"><button data-action="grid">격자</button><button data-action="feed">목록</button></nav></div></section>
 <section id="feed" aria-label="작품 목록"></section><div class="load-more"><button id="load-more" data-action="load-more" hidden>더 불러오기</button></div>
 <footer class="lab-footer">Dusk public edition · 29 node operators · PNG / JSON / Godot</footer>
</main>
<dialog id="editor" aria-labelledby="editor-title">
 <div class="dialog-head"><div><small>EFFECT WORKSPACE</small><h2 id="editor-title">작품 편집</h2></div><button data-action="close" aria-label="편집기 닫기">닫기</button></div>
 <div class="editor-toolbar"><input id="name" aria-label="이펙트 이름"><button data-action="add">노드 추가</button><button data-action="tidy">정렬</button><button data-action="remix-current">AI 수정</button><button id="undo-ai" data-action="undo-ai" hidden>이전 작품</button><button data-action="export">내보내기</button><button class="primary" data-action="save">작업 저장</button></div>
 <div class="editor-tabs"><button data-action="nodes">노드 연결</button><button data-action="json">JSON 편집</button></div>
 <div class="editor-body"><aside class="inspector"><div class="checker preview"><canvas id="preview" width="64" height="64" aria-label="작품 미리보기"></canvas></div><div class="transport"><button data-action="prev" aria-label="이전 프레임">◀</button><button data-action="play" aria-label="재생 일시정지">Ⅱ</button><button data-action="next" aria-label="다음 프레임">▶</button><input id="scrub" type="range" min="0" max="23" value="0" aria-label="프레임"><small id="frame-label"></small></div><div class="settings"><label>캔버스 <select id="size"><option>32</option><option>48</option><option selected>64</option><option>96</option><option>128</option></select></label><label>프레임 수 <input id="frames" type="number" min="1" max="32"></label><label>FPS <input id="fps" type="number" min="1" max="60"></label><label><input id="loop" type="checkbox"> 반복 재생</label><button data-action="bg">배경 전환</button></div><div id="properties"><p>노드를 선택해 속성을 조절하세요.</p></div></aside><section class="graph-wrap" aria-label="연결 편집"><div id="graph" aria-label="노드 그래프"><svg id="wires"></svg><div id="nodes"></div></div><textarea id="graph-json" aria-label="그래프 JSON" spellcheck="false" hidden></textarea><button id="apply-json" data-action="apply-json" hidden>JSON 반영</button></section></div>
 <p id="ai-summary" role="status" hidden></p><div id="editor-status" role="status"></div>
</dialog>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title"></h2><button data-action="close" aria-label="닫기">닫기</button></div><div id="modal-body"></div></dialog>
<input id="file" type="file" accept=".json,.pxf.json,application/json" hidden><div id="toast" role="status"></div>
<script type="module" src="/shared/shell.mjs"></script><script type="module" src="/app.mjs"></script>
</body></html>
